<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b0aa8">
<link rel="manifest" href="manifest.json">
<title>Açaí House H&A</title>
<style>
:root{--p:#5b0aa8;--p2:#8f19d8;--bg:#160022;--card:#24003b;--line:#8b27c7;--txt:#fff;--muted:#d5bce2;--ok:#3ddc97}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#13001d,#25003e);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:82px}
header{padding:20px 18px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#170023ee;backdrop-filter:blur(12px);z-index:5}
.logo{font-weight:900;font-size:25px}.logo span{color:#ef7cff}.sub{color:var(--muted);font-size:12px}
.screen{padding:12px 16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card,.item,.panel{background:linear-gradient(145deg,#290044,#1d002f);border:1px solid #8222bb;border-radius:16px;box-shadow:0 8px 25px #0004}
.card{padding:18px;min-height:112px}.card b{display:block;margin-top:8px}.icon{font-size:30px}
.btn{width:100%;border:0;border-radius:13px;padding:14px;background:linear-gradient(90deg,#7410c7,#a523e6);color:#fff;font-weight:800}
.btn.secondary{background:#2a0640;border:1px solid #8b27c7}.btn.danger{background:#6d123e}
h2{margin:6px 0 14px;font-size:22px}.muted{color:var(--muted)}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.item{padding:14px;margin-bottom:10px}.item h3{margin:0 0 5px;font-size:16px}.price{font-weight:800;color:#f29aff}
.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tab{white-space:nowrap;border:1px solid #8b27c7;background:#240039;color:#fff;padding:9px 13px;border-radius:20px}.tab.active{background:#8b1bd0}
.choice{display:flex;justify-content:space-between;align-items:center;padding:14px;margin:8px 0;border:1px solid #6f1a9d;border-radius:13px;background:#220035}.choice.selected{border-color:#d45cff;background:#350052}
.check{width:23px;height:23px;accent-color:#b52be8}
.total{font-size:27px;font-weight:900;color:#f3a4ff}.cash{font-size:28px;padding:14px;border-radius:12px;border:1px solid #8b27c7;background:#fff;color:#32113e;width:100%}
.change{padding:16px;border-radius:13px;background:#0b4735;border:1px solid #3ddc97;color:#9ff3ce;font-size:25px;font-weight:900;text-align:center}
nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);background:#160021ee;border-top:1px solid #6f1a9d;backdrop-filter:blur(14px);z-index:10}nav button{background:none;border:0;color:#c9afd5;padding:10px 4px;font-size:11px}nav button.active{color:#f08cff}nav .ni{font-size:22px;display:block}
.search{width:100%;padding:12px;border-radius:12px;border:1px solid #7d21ae;background:#1b002c;color:white;margin-bottom:12px}
.empty{text-align:center;padding:35px;color:var(--muted)}
.small{font-size:12px}.hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
<header><div><div class="logo">Açaí House <span>H&A</span></div><div class="sub">Sabor que te hace volver 💜</div></div><div>👑</div></header>
<main id="view"></main>
<nav>
<button onclick="go('home')" id="n-home"><span class="ni">⌂</span>Inicio</button>
<button onclick="go('sale')" id="n-sale"><span class="ni">🧾</span>Venta</button>
<button onclick="go('history')" id="n-history"><span class="ni">▤</span>Historial</button>
<button onclick="go('cash')" id="n-cash"><span class="ni">▣</span>Caja</button>
</nav>
</div>
<script>
const KEY='acaiHouseHA_v1';
const defaultData={
sales:[], products:{
acai:{traditional:[
{name:'Açaí tradicional de fruta',desc:'Leche en polvo, leche condensada, durazno, banana',prices:{'200 ml':15000,'300 ml':20000,'400 ml':25000,'500 ml':30000}},
{name:'Açaí tradicional de granola + Nutella',desc:'Leche en polvo, leche condensada, granola, Nutella o dulce de leche',prices:{'200 ml':15000,'300 ml':20000,'400 ml':25000,'500 ml':30000}}],
special:[
{name:'Doble frutal',desc:'Leche en polvo, leche condensada, durazno, banana, kiwi, frutilla'},
{name:'Bombón',desc:'Leche en polvo, leche condensada, bombón, Nutella o dulce de leche'},
{name:'Oreo',desc:'Leche en polvo, leche condensada, Oreo, Nutella o dulce de leche'},
{name:'Tres leches',desc:'Leche en polvo, leche condensada, dulce de leche'}],specialPrices:{'200 ml':18000,'300 ml':25000,'400 ml':30000,'500 ml':35000}},
extras:['Leche en polvo','Leche condensada','Dulce de leche','Nutella','Granola','Durazno','Banana','Kiwi','Frutilla','Açaí'].reduce((o,x)=>(o[x]=3000,o),{}),
ice:{
loaded:[['1 sabor',4000],['2 sabores',8000],['3 sabores',12000]],
icopor:[['Un cuarto',15000],['Medio',25000],['Un kilo',40000]],
varied:[['Picolon',4000],['Bañado en chocolate',5000],['Artesanal',3000],['Frutal',2000],['Chupachup',1000]]
},payments:['Efectivo','Transferencia','Tarjeta','QR']
}, settings:{}
};
let data=JSON.parse(localStorage.getItem(KEY)||'null')||defaultData;
let cart=[];let current=null;
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
const money=n=>'G. '+Number(n).toLocaleString('es-PY');
function go(page){location.hash=page;render()}
function setNav(page){document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));let b=document.getElementById('n-'+page);if(b)b.classList.add('active')}
function render(){
 let p=location.hash.slice(1)||'home'; setNav(p==='saleitem'?'sale':p);
 if(p==='home')home(); else if(p==='sale')sale(); else if(p==='history')history(); else if(p==='cash')cash(); else if(p==='products')products(); else home();
}
function home(){view.innerHTML=`<section class="screen"><div class="panel" style="padding:22px;margin-bottom:14px;text-align:center"><div style="font-size:44px">🍧</div><h2>Açaí House H&A</h2><div class="muted">Caja rápida para tu negocio</div></div><div class="grid">
<div class="card" onclick="go('sale')"><div class="icon">🧾</div><b>Nueva venta</b><span class="small muted">Registrar pedido y cobrar</span></div>
<div class="card" onclick="go('history')"><div class="icon">📋</div><b>Historial</b><span class="small muted">Ver ventas guardadas</span></div>
<div class="card" onclick="go('cash')"><div class="icon">💰</div><b>Caja del día</b><span class="small muted">Totales por pago</span></div>
<div class="card" onclick="go('products')"><div class="icon">📦</div><b>Productos y precios</b><span class="small muted">Consultar catálogo</span></div></div></section>`}
function sale(){cart=[];view.innerHTML=`<section class="screen"><h2>Nueva venta</h2><div class="tabs"><button class="tab active" onclick="pickCat('acai',this)">Açaí</button><button class="tab" onclick="pickCat('ice',this)">Helados</button><button class="tab" onclick="pickCat('extras',this)">Agregados</button></div><div id="saleArea"></div></section>`;pickCat('acai')}
function pickCat(cat,el){
 if(el){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active')}
 let a=document.getElementById('saleArea');
 if(cat==='acai')a.innerHTML=`<div class="tabs"><button class="tab active" onclick="acaiList('traditional',this)">Tradicionales</button><button class="tab" onclick="acaiList('special',this)">Especiales</button></div><div id="catList"></div>`; else if(cat==='ice')a.innerHTML=`<h3>Helados cargados</h3><div id="catList">${data.products.ice.loaded.map(x=>choice(x[0],x[1],()=>add(x[0],x[1]))).join('')}</div><h3>Helados en icopor</h3>${data.products.ice.icopor.map(x=>choice(x[0],x[1],()=>add('Helado en icopor - '+x[0],x[1]))).join('')}<h3>Helados variados</h3>${data.products.ice.varied.map(x=>choice(x[0],x[1],()=>add('Helado '+x[0],x[1]))).join('')}<button class="btn" onclick="checkout()">Ver pedido (${cart.length})</button>`; else a.innerHTML=`<h3>Agregados — G. 3.000 c/u</h3>${Object.entries(data.products.extras).map(([n,p])=>choice(n,p,()=>add('Agregado: '+n,p))).join('')}<button class="btn" onclick="checkout()">Ver pedido (${cart.length})</button>`;
}
function acaiList(type){let list=type==='traditional'?data.products.acai.traditional:data.products.acai.special;let prices=type==='traditional'?list[0].prices:data.products.acai.specialPrices;catList.innerHTML=list.map((x,i)=>`<div class="item"><h3>${x.name}</h3><div class="small muted">${x.desc}</div>${Object.entries(prices).map(([s,p])=>choice(s,p,()=>add(x.name+' — '+s,p))).join('')}</div>`).join('')+`<h3>Agregados</h3>${Object.entries(data.products.extras).map(([n,p])=>choice(n,p,()=>add('Agregado: '+n,p))).join('')}<button class="btn" onclick="checkout()">Ver pedido (${cart.length})</button>`}
function choice(n,p,fn){return `<div class="choice" onclick='(${fn.toString()})()'><span>${n}<br><b class="price">${money(p)}</b></span><span>＋</span></div>`}
function add(name,price){cart.push({name,price});checkout()}
function checkout(){let total=cart.reduce((s,x)=>s+x.price,0);view.innerHTML=`<section class="screen"><h2>Tu pedido</h2>${cart.length?cart.map((x,i)=>`<div class="item row"><span>${x.name}</span><b>${money(x.price)}</b><button class="tab" onclick="cart.splice(${i},1);checkout()">✕</button></div>`).join(''):'<div class="empty">Todavía no agregaste productos.</div>'}<div class="panel" style="padding:16px;margin-top:12px"><div class="row"><span>Total</span><span class="total">${money(total)}</span></div><h3>Método de pago</h3><div class="grid">${data.products.payments.map(p=>`<button class="btn secondary" onclick="pay('${p}')">${p}</button>`).join('')}</div></div><button class="btn secondary" style="margin-top:10px" onclick="go('sale')">＋ Seguir comprando</button></section>`}
function pay(method){let total=cart.reduce((s,x)=>s+x.price,0);if(method!=='Efectivo'){finish(method,total,0)}else{view.innerHTML=`<section class="screen"><h2>Cobro en efectivo</h2><div class="panel" style="padding:18px"><div class="muted">Total de la venta</div><div class="total">${money(total)}</div><input id="cashIn" class="cash" type="number" inputmode="numeric" placeholder="Dinero recibido" oninput="calcChange(${total})"><div id="chg" style="margin-top:12px"></div><button class="btn" style="margin-top:12px" onclick="finish('Efectivo',${total},Number(document.getElementById('cashIn').value)-${total})">✓ Registrar venta</button></div></section>`}}
function calcChange(total){let v=Number(cashIn.value||0);chg.innerHTML=v>=total?`<div class="change">Vuelto: ${money(v-total)}</div>`:`<div class="muted">Faltan ${money(total-v)}</div>`}
function finish(method,total,change){if(method==='Efectivo' && change<0){alert('El dinero recibido es menor al total.');return}data.sales.unshift({id:Date.now(),time:new Date().toISOString(),items:[...cart],total,method,received:method==='Efectivo'?total+change:total,change});save();cart=[];view.innerHTML=`<section class="screen"><div class="panel" style="padding:30px;text-align:center"><div style="font-size:50px">✅</div><h2>Venta registrada</h2><div class="total">${money(total)}</div><p class="muted">${method}${method==='Efectivo'?` · Vuelto ${money(change)}`:''}</p><button class="btn" onclick="go('sale')">Nueva venta</button></div></section>`}
function history(){view.innerHTML=`<section class="screen"><h2>Historial de ventas</h2><input class="search" placeholder="Buscar producto o método..." oninput="filterSales(this.value)"><div id="salesList"></div></section>`;filterSales('')}
function filterSales(q){let arr=data.sales.filter(s=>JSON.stringify(s).toLowerCase().includes(q.toLowerCase()));salesList.innerHTML=arr.length?arr.map(s=>`<div class="item"><div class="row"><b>${new Date(s.time).toLocaleString('es-PY',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'})}</b><b class="price">${money(s.total)}</b></div><div class="small muted">${s.items.map(i=>i.name).join(' · ')}</div><div class="small">${s.method}${s.method==='Efectivo'?' · Recibió '+money(s.received)+' · Vuelto '+money(s.change):''}</div></div>`).join(''):'<div class="empty">No hay ventas todavía.</div>'}
function cash(){let today=new Date().toDateString();let ss=data.sales.filter(s=>new Date(s.time).toDateString()===today);let total=ss.reduce((a,s)=>a+s.total,0);let by={};data.products.payments.forEach(p=>by[p]=ss.filter(s=>s.method===p).reduce((a,s)=>a+s.total,0));view.innerHTML=`<section class="screen"><h2>Caja del día</h2><div class="panel" style="padding:20px;text-align:center"><div class="muted">Total vendido</div><div class="total">${money(total)}</div><div class="small muted">${ss.length} ventas</div></div><div style="margin-top:12px">${Object.entries(by).map(([p,n])=>`<div class="item row"><span>${p}</span><b>${money(n)}</b></div>`).join('')}</div><button class="btn" onclick="alert('Cierre de caja: '+money(total))">🔒 Cerrar caja</button></section>`}
function products(){let t=data.products.acai.traditional[0].prices;view.innerHTML=`<section class="screen"><h2>Productos y precios</h2><div class="item"><h3>Açaí tradicionales</h3>${Object.entries(t).map(([s,p])=>`<div class="row" style="padding:7px 0"><span>${s}</span><b>${money(p)}</b></div>`).join('')}</div><div class="item"><h3>Açaí especiales</h3>${Object.entries(data.products.acai.specialPrices).map(([s,p])=>`<div class="row" style="padding:7px 0"><span>${s}</span><b>${money(p)}</b></div>`).join('')}</div><div class="item"><h3>Agregados</h3>${Object.entries(data.products.extras).map(([n,p])=>`<div class="row" style="padding:7px 0"><span>${n}</span><b>${money(p)}</b></div>`).join('')}</div><div class="item"><h3>Helados</h3>${[...data.products.ice.loaded,...data.products.ice.icopor,...data.products.ice.varied].map(x=>`<div class="row" style="padding:7px 0"><span>${x[0]}</span><b>${money(x[1])}</b></div>`).join('')}</div><p class="small muted">Los datos de ventas se guardan en este dispositivo.</p></section>`}
window.addEventListener('hashchange',render);render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
